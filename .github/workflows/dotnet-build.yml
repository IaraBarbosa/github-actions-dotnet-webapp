name: Build Workflow

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *' 

  workflow_dispatch:

jobs:
  build-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Builda Webapp
        run: dotnet build **/*.csproj --no-restore

  roda-workflow:
      runs-on: ubuntu-latest
      needs: build-workflow
      steps:
        - name: Roda Webapp
            dotnet run --project **/*.csproj